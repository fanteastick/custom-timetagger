name: "Build and publish Docker images to GHCR"

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:

  # Build default privileged container image version
  docker-root:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: deploy/repo.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Build non-root container image variant
  docker-nonroot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta-nonroot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No "latest" tag for the non-root variant.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-nonroot
            type=raw,value=latest-nonroot,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: deploy/repo.nonroot.Dockerfile
          push: true
          tags: ${{ steps.meta-nonroot.outputs.tags }}
          labels: ${{ steps.meta-nonroot.outputs.labels }}
